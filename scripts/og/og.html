<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <!-- Social card. Rendered to public/og.png by `node scripts/og/render.mjs`.
         Everything is inline on purpose: no build step, no font CDN. -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        src: url('/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
          format('woff2-variations');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        src: url('/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2')
          format('woff2');
      }

      :root {
        --bg: #ffffff;
        --text: #0b0b0f;
        --muted: #5e5e6b;
        --faint: #8b8b98;
        --accent: #0b64bd;
        --hairline: #e9e9ee;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: 'calt' 1;
      }

      .wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(90% 80% at 12% -10%, rgb(11 100 189 / 0.09), transparent 62%),
          radial-gradient(60% 60% at 100% 0%, rgb(11 100 189 / 0.05), transparent 70%);
      }

      .card {
        position: relative;
        height: 100%;
        padding: 64px 72px 56px;
        display: flex;
        flex-direction: column;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand img {
        width: 48px;
        height: 48px;
      }

      .brand span {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .brand .tld {
        font-size: 0.9375em;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--faint);
        margin-left: -0.03em;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .eyebrow::before {
        content: '';
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.75;
      }

      h1 {
        margin-top: 78px;
        max-width: 1010px;
        font-weight: 600;
        font-size: 68px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      h1 em {
        font-style: normal;
        color: var(--accent);
      }

      .rule {
        flex: none;
        margin-top: 48px;
        height: 1px;
        background: var(--hairline);
      }

      .facts {
        flex: none;
        margin-top: 24px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 40px;
      }

      .facts ul {
        display: flex;
        gap: 56px;
        list-style: none;
      }

      .fact strong {
        display: block;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
        font-variant-numeric: tabular-nums;
      }

      .fact span {
        font-size: 15px;
        color: var(--muted);
      }

      .place {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13px;
        color: var(--faint);
        white-space: nowrap;
        padding-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="wash"></div>
    <div class="card">
      <div class="top">
        <div class="brand">
          <img src="/public/brand/logo-mark.png" alt="" />
          <span>Mezomite<span class="tld">.ai</span></span>
        </div>
        <p class="eyebrow">Audit proses · Otomasi · Agen AI</p>
      </div>

      <h1>Kami audit cara kerja Anda, lalu <em>otomatiskan</em> bagian yang repetitif.</h1>

      <div class="rule"></div>

      <div class="facts">
        <ul>
          <li class="fact">
            <strong>Rp 1,5 juta</strong>
            <span>Paket awal, harga tetap</span>
          </li>
          <li class="fact">
            <strong>2 minggu</strong>
            <span>Laporan yang bisa dipakai</span>
          </li>
          <li class="fact">
            <strong>ID / EN</strong>
            <span>Dua bahasa, satu metode</span>
          </li>
        </ul>
        <p class="place">Jakarta · Indonesia</p>
      </div>
    </div>
  </body>
</html>
