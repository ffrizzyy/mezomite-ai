# Cloudflare Pages configuration.
# Astro builds to ./dist; Pages Functions live in ./functions.
name = "mezomite-ai"
compatibility_date = "2026-10-24"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "mezomite-db"
database_id = "ecd4a38d-d26d-484f-a168-ebf60104d779"
migrations_dir = "db/migrations"

[vars]
SITE_ORIGIN = "https://mezomite.ai"
# Where the firm reads its enquiries, and the identity Resend signs them with.
# MAIL_FROM must be an address on a domain verified in Resend, or the send is
# rejected (the row is still stored, marked failed).
MAIL_FROM = "djournl.app@gmail.com"
MAIL_TO = "m.farrel2222@gmail.com"
